name: Migrate and Upload Artifacts

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  migrate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run migrate.py
        run: python migrate.py

      - name: Upload Zip Files as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-data-zips
          path: /tmp/work/dataLib-dp/dist/*.zip
          if-no-files-found: error
